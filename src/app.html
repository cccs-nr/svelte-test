<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				const root = document.documentElement;
				try {
					const preference = localStorage.getItem('secret-santa-theme');
					const dark =
						preference === 'dark' ||
						(preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					root.classList.toggle('dark', dark);
					root.style.colorScheme = dark ? 'dark' : 'light';
				} catch {
					const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					root.classList.toggle('dark', dark);
					root.style.colorScheme = dark ? 'dark' : 'light';
				}
			})();
		</script>
		<script>
			(() => {
				try {
					const root = document.documentElement;
					// High Visibility Mode is on unless the person has turned it off.
					root.dataset.visibility =
						localStorage.getItem('secret-santa-high-visibility') === 'normal' ? 'normal' : 'high';
					const guidance = localStorage.getItem('secret-santa-guidance');
					root.dataset.guidance =
						guidance === 'simple' || guidance === 'off' ? guidance : 'detailed';
				} catch {
					document.documentElement.dataset.visibility = 'high';
					document.documentElement.dataset.guidance = 'detailed';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
