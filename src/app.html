<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				const root = document.documentElement;
				try {
					const preference = localStorage.getItem('secret-santa-theme');
					const dark =
						preference === 'dark' ||
						(preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					root.classList.toggle('dark', dark);
					root.style.colorScheme = dark ? 'dark' : 'light';
				} catch {
					const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					root.classList.toggle('dark', dark);
					root.style.colorScheme = dark ? 'dark' : 'light';
				}
			})();
		</script>
		<script>
			(() => {
				try {
					const root = document.documentElement;
					root.dataset.text =
						localStorage.getItem('secret-santa-text') === 'standard' ? 'standard' : 'large';
					root.dataset.contrast =
						localStorage.getItem('secret-santa-contrast') === 'high' ? 'high' : 'normal';
				} catch {
					// Defaults apply when storage is unavailable.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
