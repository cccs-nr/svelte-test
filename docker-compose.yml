services:
  app:
    build:
      context: .
      args:
        ORIGIN: '${ORIGIN:-http://localhost:${PORT:-3000}}'
    init: true
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: /app/data/secret-santa.sqlite
      UPLOADS_DIR: /app/uploads
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
    volumes:
      - secret-santa-data:/app/data
      - secret-santa-uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  secret-santa-data:
  secret-santa-uploads:
